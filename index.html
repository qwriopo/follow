<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>인스타 맞팔 분석기</title>

<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f5f6f7;
    margin: 0;
    padding: 20px;
  }

  h1 {
    text-align: center;
  }

  .container {
    max-width: 800px;
    margin: auto;
  }

  .card {
    background: white;
    padding: 15px;
    border-radius: 15px;
    margin-bottom: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  }

  input {
    margin: 5px 0;
  }

  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: black;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }

  ul {
    max-height: 200px;
    overflow-y: auto;
    padding-left: 20px;
  }

  .count {
    font-weight: bold;
    margin-bottom: 10px;
  }
</style>
</head>

<body>

<div class="container">

<h1>📊 인스타 맞팔 분석기</h1>

<div class="card">
  <p>📁 팔로잉 (following.json)</p>
  <input type="file" id="followingFile">

  <p>📁 팔로워 (followers 여러 개 가능)</p>
  <input type="file" id="followersFile" multiple>

  <button onclick="analyze()">분석하기</button>
</div>

<div class="card">
  <div class="count">👥 팔로잉 수: <span id="followingCount">0</span></div>
  <div class="count">👥 팔로워 수: <span id="followersCount">0</span></div>
</div>

<div class="card">
  <h3>❌ 내가 팔로우만 하는 사람</h3>
  <div class="count">총 <span id="notFollowingCount">0</span>명</div>
  <ul id="notFollowingBack"></ul>
</div>

<div class="card">
  <h3>❌ 나만 팔로우 하는 사람</h3>
  <div class="count">총 <span id="notFollowerCount">0</span>명</div>
  <ul id="notFollowerBack"></ul>
</div>

</div>

<script>
async function readJSON(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        resolve(JSON.parse(reader.result));
      } catch {
        alert("JSON 오류");
        reject();
      }
    };
    reader.readAsText(file);
  });
}

function clean(username) {
  return username.trim().toLowerCase();
}

function extractUsernames(data) {
  let usernames = [];

  if (!Array.isArray(data)) return usernames;

  data.forEach(item => {
    if (!item || !item.string_list_data) return;

    item.string_list_data.forEach(user => {
      if (user && user.value) {
        usernames.push(user.value);
      }
    });
  });

  return usernames;
}

async function analyze() {
  const followingFile = document.getElementById('followingFile').files[0];
  const followerFiles = document.getElementById('followersFile').files;

  if (!followingFile || followerFiles.length === 0) {
    alert("파일 다 넣어라");
    return;
  }

  // 팔로잉
  const followingData = await readJSON(followingFile);
  let following = extractUsernames(
    followingData.relationships_following || []
  ).map(clean);

  // 팔로워 (여러 파일)
  let followers = [];

  for (let file of followerFiles) {
    const data = await readJSON(file);
    followers = followers.concat(extractUsernames(data));
  }

  followers = followers.map(clean);

  // 중복 제거
  following = [...new Set(following)];
  followers = [...new Set(followers)];

  // 비교
  const notFollowingBack = following.filter(u => !followers.includes(u));
  const notFollowerBack = followers.filter(u => !following.includes(u));

  // 카운트 표시
  document.getElementById("followingCount").innerText = following.length;
  document.getElementById("followersCount").innerText = followers.length;
  document.getElementById("notFollowingCount").innerText = notFollowingBack.length;
  document.getElementById("notFollowerCount").innerText = notFollowerBack.length;

  // 출력
  const list1 = document.getElementById("notFollowingBack");
  const list2 = document.getElementById("notFollowerBack");

  list1.innerHTML = "";
  list2.innerHTML = "";

  notFollowingBack.forEach(user => {
    list1.innerHTML += `<li>${user}</li>`;
  });

  notFollowerBack.forEach(user => {
    list2.innerHTML += `<li>${user}</li>`;
  });
}
</script>

</body>
</html>
