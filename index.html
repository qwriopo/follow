<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>인스타 맞팔 분석기 (HTML)</title>
<style>
  body {
    font-family: -apple-system, sans-serif;
    background: #f5f6f7;
    padding: 20px;
  }
  .card {
    background: white;
    padding: 15px;
    border-radius: 15px;
    margin-bottom: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  }
  button {
    width: 100%;
    padding: 12px;
    background: black;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  ul {
    max-height: 200px;
    overflow-y: auto;
    padding: 0;
  }
  li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  li:last-child {
    border-bottom: none;
  }
  .delete-btn {
    background: none;
    border: none;
    color: #999;
    font-size: 16px;
    cursor: pointer;
    padding: 0 4px;
    width: auto;
    line-height: 1;
  }
  .delete-btn:hover {
    color: #e00;
  }
</style>
</head>
<body>
<h1>📊 인스타 맞팔 분석기 (HTML)</h1>
<div class="card">
  <p>📁 팔로잉 HTML</p>
  <input type="file" id="followingFile">
  <p>📁 팔로워 HTML</p>
  <input type="file" id="followersFile">
  <button onclick="analyze()">분석</button>
</div>
<div class="card">
  팔로잉: <span id="followingCount">0</span><br>
  팔로워: <span id="followersCount">0</span>
</div>
<div class="card">
  <h3>❌ 내가 팔로우만 (맞팔 안 됨)</h3>
  <div>총 <span id="notFollowingCount">0</span>명</div>
  <ul id="notFollowingBack"></ul>
</div>
<div class="card">
  <h3>❌ 나만 팔로우 (일방적 팔로워)</h3>
  <div>총 <span id="notFollowerCount">0</span>명</div>
  <ul id="notFollowerBack"></ul>
</div>
<script>
let notFollowingList = [];
let notFollowerList = [];

async function readFile(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.readAsText(file);
  });
}

function extractFromHTML(html) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, "text/html");
  let usernames = [];

  doc.querySelectorAll("a").forEach(a => {
    let href = a.getAttribute("href") || "";
    let match = href.match(/instagram\.com\/_u\/([a-zA-Z0-9_.]+)/);
    if (!match) {
      match = href.match(/instagram\.com\/([a-zA-Z0-9_.]+)\/?(?:\?.*)?$/);
    }
    if (match) {
      const username = match[1].toLowerCase();
      const excluded = ["explore", "reels", "stories", "accounts", "p", "tv", "reel", "direct", "_u"];
      if (!excluded.includes(username)) usernames.push(username);
    }
  });

  return [...new Set(usernames)];
}

function renderList(listId, countId, arr, type) {
  const ul = document.getElementById(listId);
  document.getElementById(countId).innerText = arr.length;
  ul.innerHTML = "";
  arr.forEach(u => {
    const li = document.createElement("li");
    li.innerHTML = `<span>${u}</span>`;
    const btn = document.createElement("button");
    btn.className = "delete-btn";
    btn.textContent = "✕";
    btn.onclick = () => removeUser(type, u);
    li.appendChild(btn);
    ul.appendChild(li);
  });
}

function removeUser(type, username) {
  if (type === "notFollowing") {
    notFollowingList = notFollowingList.filter(u => u !== username);
    renderList("notFollowingBack", "notFollowingCount", notFollowingList, "notFollowing");
  } else {
    notFollowerList = notFollowerList.filter(u => u !== username);
    renderList("notFollowerBack", "notFollowerCount", notFollowerList, "notFollower");
  }
}

async function analyze() {
  const followingFile = document.getElementById('followingFile').files[0];
  const followersFile = document.getElementById('followersFile').files[0];
  if (!followingFile || !followersFile) {
    alert("파일 넣어라");
    return;
  }
  const followingHTML = await readFile(followingFile);
  const followersHTML = await readFile(followersFile);
  const following = extractFromHTML(followingHTML);
  const followers = extractFromHTML(followersHTML);

  notFollowingList = following.filter(u => !followers.includes(u));
  notFollowerList = followers.filter(u => !following.includes(u));

  document.getElementById("followingCount").innerText = following.length;
  document.getElementById("followersCount").innerText = followers.length;

  renderList("notFollowingBack", "notFollowingCount", notFollowingList, "notFollowing");
  renderList("notFollowerBack", "notFollowerCount", notFollowerList, "notFollower");
}
</script>
</body>
</html>
